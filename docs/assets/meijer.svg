<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="How the Meijer plugin fits into the pipeline"><title>How the Meijer plugin fits into the pipeline</title><defs><marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#111" stroke-width="1.4"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b92232" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#195bbb" stroke-width="1.4"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#999" stroke-width="1.4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="520" fill="#ebebeb"/><text x="30" y="42" text-anchor="start" font-size="22" font-weight="700" fill="#111">Meijer plugin</text><rect x="20" y="65" width="1160" height="175" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="40" y="90" width="250" height="125" fill="white" stroke="#888" stroke-width="1"/><text x="165.0" y="132.2" text-anchor="middle" font-size="22" font-weight="700" fill="#111">check.mjs</text><text x="165.0" y="166.2" text-anchor="middle" font-size="19" font-weight="400" fill="#111">parses the program,</text><text x="165.0" y="194.2" text-anchor="middle" font-size="19" font-weight="400" fill="#111">traces data flows</text><path d="M290 152H330" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="330" y="90" width="250" height="125" fill="white" stroke="#888" stroke-width="1"/><text x="455.0" y="132.2" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Summary</text><text x="455.0" y="166.2" text-anchor="middle" font-size="19" font-weight="400" fill="#111">effects +</text><text x="455.0" y="194.2" text-anchor="middle" font-size="19" font-weight="400" fill="#111">dependencies</text><path d="M580 152H620" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="620" y="90" width="250" height="125" fill="white" stroke="#888" stroke-width="1"/><text x="745.0" y="132.2" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Laws</text><text x="745.0" y="166.2" text-anchor="middle" font-size="19" font-weight="400" fill="#111">data_safe,</text><text x="745.0" y="194.2" text-anchor="middle" font-size="19" font-weight="400" fill="#111">outcome_safe, …</text><rect x="910" y="90" width="250" height="125" fill="white" stroke="#888" stroke-width="1"/><text x="1035.0" y="132.2" text-anchor="middle" font-size="22" font-weight="700" fill="#111">dispatch guard</text><text x="1035.0" y="166.2" text-anchor="middle" font-size="19" font-weight="400" fill="#111">approvals +</text><text x="1035.0" y="194.2" text-anchor="middle" font-size="19" font-weight="400" fill="#111">byte budgets</text><text x="30" y="297" text-anchor="start" font-size="22" font-weight="700" fill="#111">ProofGuard pipeline</text><rect x="20" y="320" width="1160" height="175" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="40" y="360" width="250" height="100" fill="white" stroke="#888" stroke-width="1"/><text x="165.0" y="417.35" text-anchor="middle" font-size="21" font-weight="700" fill="#111">Proposed program</text><path d="M290 410H620" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><text x="455" y="392" text-anchor="middle" font-size="16" font-weight="400" fill="#111">Bend2 program</text><rect x="620" y="345" width="250" height="130" fill="white" stroke="#888" stroke-width="1"/><text x="745.0" y="403.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Verify</text><text x="745.0" y="437.7" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Bend + BendTT</text><path d="M870 410H910" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="910" y="345" width="250" height="130" fill="#fbedef" stroke="#b92232" stroke-width="2"/><text x="1035.0" y="389.7" text-anchor="middle" font-size="22" font-weight="700" fill="#b92232">Gateway</text><text x="1035.0" y="423.7" text-anchor="middle" font-size="19" font-weight="400" fill="#111">run main, guard,</text><text x="1035.0" y="451.7" text-anchor="middle" font-size="19" font-weight="400" fill="#111">apply the batch</text><path d="M745 215V345" fill="none" stroke="#195bbb" stroke-width="2" marker-end="url(#arrow-blue)"/><path d="M1035 215V345" fill="none" stroke="#195bbb" stroke-width="2" marker-end="url(#arrow-blue)"/></g></svg>
