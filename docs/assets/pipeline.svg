<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="The steps from a proposal to its effects"><title>The steps from a proposal to its effects</title><defs><marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#111" stroke-width="1.4"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b92232" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#195bbb" stroke-width="1.4"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#999" stroke-width="1.4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="360" fill="#ebebeb"/><text x="30" y="42" text-anchor="start" font-size="22" font-weight="700" fill="#111">From proposal to effect</text><rect x="20" y="65" width="1160" height="275" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="45" y="95" width="196" height="110" fill="white" stroke="#888" stroke-width="1"/><text x="143.0" y="143.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111">1. Receive</text><text x="143.0" y="177.7" text-anchor="middle" font-size="19" font-weight="400" fill="#111">from the outbox</text><path d="M241 150H273" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="273" y="95" width="196" height="110" fill="white" stroke="#888" stroke-width="1"/><text x="371.0" y="143.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111">2. Verify</text><text x="371.0" y="177.7" text-anchor="middle" font-size="19" font-weight="400" fill="#111">types + plugin laws</text><path d="M469 150H501" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="501" y="95" width="196" height="110" fill="white" stroke="#888" stroke-width="1"/><text x="599.0" y="143.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111">3. Execute</text><text x="599.0" y="177.7" text-anchor="middle" font-size="19" font-weight="400" fill="#111">private inputs</text><path d="M697 150H729" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="729" y="95" width="196" height="110" fill="#fbedef" stroke="#b92232" stroke-width="2"/><text x="827.0" y="143.7" text-anchor="middle" font-size="22" font-weight="700" fill="#b92232">4. Apply</text><text x="827.0" y="177.7" text-anchor="middle" font-size="19" font-weight="400" fill="#111">validate the batch</text><path d="M925 150H957" fill="none" stroke="#b92232" stroke-width="2" marker-end="url(#arrow-red)"/><rect x="957" y="95" width="196" height="110" fill="white" stroke="#888" stroke-width="1"/><text x="1055.0" y="143.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111">5. Report</text><text x="1055.0" y="177.7" text-anchor="middle" font-size="19" font-weight="400" fill="#111">result to /results</text><path d="M371 205V250" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><text x="371" y="282" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Rejected → nothing runs,</text><text x="371" y="308" text-anchor="middle" font-size="19" font-weight="400" fill="#111">the agent gets a status</text></g></svg>
